name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, compile and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1 pytest-asyncio==1.4.0 pytest-cov==7.1.0 ruff==0.16.1

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Py-compile all files
        run: |
          python -m py_compile app/*.py app/handlers/*.py admin/*.py scripts/*.py tests/*.py tests/unit/*.py tests/live/*.py

      - name: Unit tests (no live)
        run: python -m pytest tests/unit -m "not live" --quiet

  docker-build:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fitness-coach:ci .
