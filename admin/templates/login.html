<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Fitness Coach</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 360px; }
        h2 { text-align: center; margin-bottom: 24px; color: #2c3e50; }
        input { width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        button:hover { background: #34495e; }
        .error { color: #dc2626; text-align: center; margin-bottom: 14px; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h2>📋 Fitness Coach — Админка</h2>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST">
        {% if demo_mode %}
        <div style="background: #fff3cd; border: 1px solid #ffc107; padding: 12px; margin-bottom: 16px; border-radius: 4px; color: #856404;">
            <strong>⚠️ DEMO</strong> — не вводите реальные персональные данные.
        </div>
        {% endif %}
        <input type="text" name="username" placeholder="Логин" required>
        <input type="password" name="password" placeholder="Пароль" required>
        <button type="submit">Войти</button>
    </form>
</div>
</body>
</html>
