version: "3.9"

services:
  fitness-coach:
    build: .
    container_name: fitness-coach
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
      - ./content:/app/content

    ports:
      - "8001:8001"

    command: python -m app.bot

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  webadmin:
    build: .
    container_name: fitness-coach-webadmin
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      - "5004:5004"
    command: python -m admin.web

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
