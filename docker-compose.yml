version: "3.9"

services:
  fitness-coach:
    build: .
    container_name: fitness-coach
    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./logs:/app/logs
      - ./content:/app/content

    command: python -m app.bot
