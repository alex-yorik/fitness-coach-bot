# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Все значимые изменения проекта документируются в этом файле.

Формат основан на [Keep a Changelog](https://keepachangelog.com/ru/1.1.0/),
проект придерживается [Semantic Versioning](https://semver.org/spec/v2.0.0.html)
и [Conventional Commits](https://www.conventionalcommits.org/ru/v1.0.0/).

Генерируется автоматически: `git-cliff -o CHANGELOG.md`.

Разделы: **Added** — новые возможности, **Changed** — изменения существующего,
**Fixed** — исправления, **Security** — улучшения безопасности.
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | split(pat="\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true
postprocessors = []

[git]
# Парсить коммиты по спецификации Conventional Commits.
conventional_commits = true
# Не отбрасывать не-conventional коммиты: в истории есть важные
# security-коммиты без type-префикса — они попадают в группу через parsers.
filter_unconventional = false
require_conventional = false
split_commits = false
commit_preprocessors = []
protect_breaking_commits = false
# Группировка в разделы Added / Changed / Fixed / Security.
# Числовые метки в начале группы обеспечивают порядок секций в changelog.
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Added" },
    { message = "^fix", group = "<!-- 2 -->Fixed" },
    { message = "^security", group = "<!-- 3 -->Security" },
    { body = ".*security", group = "<!-- 3 -->Security" },
    { message = ".*", group = "<!-- 1 -->Changed" },
]
filter_commits = false
fail_on_unmatched_commit = false
link_parsers = []
use_branch_tags = false
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
recurse_submodules = false
